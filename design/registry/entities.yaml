# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: 2026-11-22

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: generation_rate
    status: active
    source: design/gdd/troop-generation.md
    referenced_by:
      - design/gdd/troop-generation.md
      - design/gdd/rope-links.md
    variables:
      - gen_amount
      - gen_interval
    output_range: [0.4, 1.2]
    expression: "gen_amount[level] / gen_interval"
    notes: "Baseline output per level 1/2/3. Invariant I3 requires the level 3 value to stay below one rope's send rate (1 / send_interval). Owned by Troop Generation; Factions may change it only inside I1-I3."
    added: 2026-11-22
    revised: ""

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added
  - name: target_resolution
    status: active
    source: design/gdd/touch-mouse-input.md
    referenced_by:
      - design/gdd/touch-mouse-input.md
      - design/gdd/rope-links.md
    variables:
      - origin
      - hit
      - blocking_keep
    output_range: [1, 1]
    # 2026-11-22 (touch-mouse-input.md / rope-links.md, cross-GDD review H3): was
    # "nearest-to-origin keep within align_tolerance degrees of the direction to
    # hit and within keep_hit_radius of the line origin-hit, never farther than
    # hit" (a one-shot redirect computed in Input).
    expression: "target = hit; repeat target = blocking_keep(origin, target) (Rope Links F6) while it is not none"
    notes: "Output is one keep (count 1). Applies to every owner and to the keyboard. The old one-shot redirect could leave a target that was itself blocked; the repeat fixes that. Strict nearer: a keep exactly as far as the target never blocks it. Rope Links decides legality of the result and never moves on to a farther keep."
    added: 2026-11-22
    revised: 2026-11-22
  - name: blocking_keep
    status: active
    source: design/gdd/rope-links.md
    referenced_by:
      - design/gdd/rope-links.md
      - design/gdd/touch-mouse-input.md
      - design/gdd/rival-ai.md
    variables:
      - o
      - t
      - align_tolerance
      - keep_hit_radius
    output_range: [0, 1]
    expression: "nearest keep k to o, other than o and t, with angle_diff(bearing(o,k), bearing(o,t)) <= align_tolerance, dist_to_line(k, o->t) <= keep_hit_radius and dist(o,k) < dist(o,t); none if no keep qualifies; equal distance -> lower id"
    notes: "Rope Links F6 (moved from Touch & Mouse Input F6, cross-GDD review H3, 2026-11-22). Output is none or one keep. tie_legal refuses 'blocked' when it is not none, so the player (redirected by Input) and the rival (filtered by tie_legal) obey one rule."
    added: 2026-11-22
    revised: ""
  - name: effective_level
    status: active
    source: design/gdd/keep-levels.md
    referenced_by:
      - design/gdd/keep-levels.md
      - design/gdd/troop-generation.md
    variables:
      - troops
      - prev
      - lv2_at
      - lv3_at
      - level_drop_margin
    output_range: [1, 3]
    # was: "max(rise_level(troops), prev) if troops >= threshold[prev] - level_drop_margin else rise_level(troops)" before 2026-11-22 (keep-levels.md F2 revised after design review: the old form gave level 1 for a level 3 keep at 10-14 troops)
    expression: "L = prev; while L > 1 and troops < threshold[L] - level_drop_margin: L = L - 1; result = max(rise_level(troops), L)"
    notes: "rise_level is 3 at troops >= lv3_at, 2 at >= lv2_at, else 1. Rising is immediate; falling steps down one band at a time, each needing the margin. Capture resets to 1 regardless (no level_dropped for a capture). Troop Generation reads the result each step."
    added: 2026-11-22
    revised: 2026-11-22
  - name: max_ropes
    status: active
    source: design/gdd/keep-levels.md
    referenced_by:
      - design/gdd/keep-levels.md
      - design/gdd/rope-links.md
      - design/gdd/rival-ai.md
      - design/gdd/level-hud.md
    variables:
      - level
      - max_ropes_table
    output_range: [1, 3]
    expression: "max_ropes_table[level]"
    notes: "Baseline table 1/2/3. Rope Links enforces it at tie time and cuts newest ropes on a level drop. Table must be non-decreasing (K4)."
    added: 2026-11-22
    revised: ""
  - name: tie_legal
    status: active
    source: design/gdd/rope-links.md
    referenced_by:
      - design/gdd/rope-links.md
      - design/gdd/touch-mouse-input.md
      - design/gdd/keep-levels.md
      - design/gdd/rival-ai.md
      - design/gdd/level-hud.md
      - design/gdd/level-state-match-flow.md
    variables:
      - origin
      - target
      - side
      - ropes_held
      - max_ropes
      - blocking_keep
    output_range: [0, 1]
    # 2026-11-22 (rope-links.md, cross-GDD review H3): blocked check added as the
    # third check; reasons were not_yours, self, duplicate, reverse, slots.
    expression: "ok unless the first failing check of [origin owned by side, target != origin, blocking_keep(origin, target) = none, no rope origin->target, not (allied target with rope target->origin), ropes_held(origin) < max_ropes(level)]"
    notes: "Output is ok or one reason: not_yours, self, blocked, duplicate, reverse, slots. No distance check (unlimited rope length, player rule). Rival uses the same check. self and blocked raise no strip text. The slots text has a singular form ('only 1 rope') and a plural form ('only N ropes') in the strings data file."
    added: 2026-11-22
    revised: 2026-11-22

  - name: win_test
    status: active
    source: design/gdd/level-state-match-flow.md
    referenced_by:
      - design/gdd/level-state-match-flow.md
      - design/gdd/troop-marching-clashes.md
    variables:
      - owner
    output_range: [0, 1]
    expression: "won = all keeps k: owner(k) = player"
    notes: "Boolean (0 or 1), tested once per step as phase 7 of Troop Marching's per-step order, on the final state of the step. Level data invariant L1 (at least one player keep and one other keep) keeps it from holding at step 0."
    added: 2026-11-22
    revised: ""
  - name: loss_test
    status: active
    source: design/gdd/level-state-match-flow.md
    referenced_by:
      - design/gdd/level-state-match-flow.md
      - design/gdd/troop-marching-clashes.md
    variables:
      - owned
      - pawns_in_flight
    output_range: [0, 1]
    expression: "lost = (owned_player = 0) and (pawns_in_flight_player = 0)"
    notes: "Boolean (0 or 1), phase 7. A player with no keep and pawns still marching has not lost. With no keep the player has no ropes or relays, so pawns_in_flight can only fall: lost within longest_rope / pawn_speed (about 11.4 s at the 1258 px longest legal rope) unless a landing pawn captures a keep."
    added: 2026-11-22
    revised: "2026-11-22"  # variables were: owned_player, pawns_in_flight_player (renamed to the source GDD's names, /consistency-check)
  - name: match_time
    status: active
    source: design/gdd/level-state-match-flow.md
    referenced_by:
      - design/gdd/level-state-match-flow.md
      - design/gdd/level-hud.md
      - design/gdd/rope-links.md
      - design/gdd/menus-screens.md
      - design/gdd/save-progress.md
      - design/gdd/stars-rewards.md
    variables:
      - deciding_step
      - start_step
    output_range: [0.0, 180.0]
    # was round((deciding_step - start_step + 1) / 60, 1); 2026-11-22: whole tenths, halves up (level-state-match-flow.md F3)
    expression: "floor((deciding_step - start_step + 1 + 3) / 6) / 10"
    notes: "Seconds, stored with a win (Save and Progress time, 0 or more) and shown on a loss. The range is normal play (2 to 3 minutes, Pillar 2); there is no upper bound because the match has no timer. Whole tenths, halves up (integer arithmetic: 6 steps a tenth, +3 rounds up). 1 or 2 steps give 0.0; 3 steps give 0.1."
    added: 2026-11-22
    revised: 2026-11-22
  - name: end_delay_steps
    status: active
    source: design/gdd/level-state-match-flow.md
    referenced_by:
      - design/gdd/level-state-match-flow.md
    variables:
      - end_delay
    output_range: [0, 300]
    expression: "ceil(end_delay * 60)"
    notes: "Fixed 1/60 s ticks between the deciding step and the overlay request; no match step runs during them (Ending). The request lands on deciding_step + max(1, end_delay_steps), so at end_delay 0 it is the next tick. 90 at baseline."
    added: 2026-11-22
    revised: ""

  - name: think_interval
    status: active
    source: design/gdd/rival-ai.md
    referenced_by:
      - design/gdd/rival-ai.md
    variables:
      - think
      - ai_think_scale
      - jitter
    # was [4, 2160] (old think ceiling 6); 2026-11-22: think up to 10 (Rival AI F1, Campaign Level Data B4), so 60 x 10 x 4 x 1.5 = 3600
    output_range: [4, 3600]
    expression: "round(60 * think * ai_think_scale * (1 - jitter + 2 * jitter * rng()))"
    notes: "Steps between rival decision passes; rng() is the rival's seeded stream. Baseline level 1: 259 to 389 steps (4.3 to 6.5 s). Floor 4 steps at every knob minimum; safe floor about 1 s. think is per-level data (Campaign Level Data)."
    added: 2026-11-22
    revised: 2026-11-22
  - name: threat
    status: active
    source: design/gdd/rival-ai.md
    referenced_by:
      - design/gdd/rival-ai.md
      - design/gdd/troop-marching-clashes.md
    variables:
      - incoming
    output_range: [0, 600]
    expression: "threat(k) = incoming(k, enemy_of(k.owner))"
    notes: "Enemy strength marching at keep k, read from Troop Marching rule 15. Strength-based, so unchanged at UAT-1 (strength 1) and correct from UAT-2."
    added: 2026-11-22
    revised: ""
  - name: target_score
    status: active
    source: design/gdd/rival-ai.md
    referenced_by:
      - design/gdd/rival-ai.md
    variables:
      - dist
      - dist_scale
      - w_defend
      - defend_margin
      - relieve_ratio
      - w_counter
      - w_neutral
      - neutral_per_troop
      - w_attack
      - attack_per_troop
      - attack_margin
      - attack_aggro
      - troop_cap
      - aggro_eff
      - stall_share
      - noise_max
    output_range: [-134, 86]
    expression: "case-based: defend w_defend - d (own keep with threat > 0, threat >= troops - defend_margin and threat >= relieve_ratio * troops); neutral w_neutral - 2*troops - d +/- bonus; player keep = max(counter w_counter - d if it ropes k, attack w_attack - 1.5*(1 - stall_share)*troops - d + 22*aggro_eff if attack_gate); plus noise_max*rng(); tie if max > 0"
    # 2026-11-22 (rival-ai.md, cross-GDD reviews X6 and round 2): attack gate was
    # origin.troops * aggro_eff > target.troops + attack_margin (4) alone; attack
    # penalty was 1.5*troops with no stall_share term; counter and attack were
    # separate cases (counter won). Output floor was -80 (wrong: a far 60-troop
    # neutral reaches about -133).
    notes: "d = dist / dist_scale (baseline 25 px per point). Baseline weights 80 / 46 / 52 / 40. attack_gate = (origin.troops * aggro_eff > target.troops + attack_margin) OR (target.troops < (troop_cap + 1) * stall_share): outside a stall only the prototype's test runs; a full stall admits every player keep; F3 never scores a keep cut_outgrown would cut, by construction (cut_outgrown exempts counters, rope(t->k), and the stall gate); and stall_share 1 removes the per-troop penalty, so the full-stall attack on a 60-troop keep at the longest rope scores >= 7.3 (11.7 at aggro_eff 1). Refined from the prototype's aiThink."
    added: 2026-11-22
    revised: 2026-11-22
  - name: aggro_eff
    status: active
    source: design/gdd/rival-ai.md
    referenced_by:
      - design/gdd/rival-ai.md
      - design/gdd/level-state-match-flow.md
    variables:
      - aggro
      - stall_steps
      - stall_time
      - stall_boost
    output_range: [0, 1]
    expression: "min(1, aggro + stall_boost * floor(stall_steps / (60 * stall_time)))"
    notes: "The stall breaker. stall_steps counts steps since the last resetting keep_captured by either side (or clock_started); a capture resets it unless it is a re-capture (the keep changed owner less than stall_time before; cross-GDD review R3H2, 2026-11-22). The same F4 also gives stall_share = min(1, stall_periods / stall_full) (stall_full 4; 0 when stall_boost is 0), used by target_score's stall gate and attack penalty and by the rival's cut_outgrown exception. Answers Level State's open question 1 (no draw rule, no match timer)."
    added: 2026-11-22
    revised: 2026-11-22

  - name: longest_rope
    status: active
    source: design/gdd/campaign-level-data.md
    referenced_by:
      - design/gdd/campaign-level-data.md
      - design/gdd/rope-links.md
      - design/gdd/level-state-match-flow.md
      - design/gdd/troop-marching-clashes.md
      - design/gdd/rival-ai.md
    variables:
      - dist
    output_range: [156, 1258]
    expression: "max over keep pairs of dist(k_i, k_j); R3 holds when send_interval >= longest_rope / (speed_min * (pawns_per_rope_max - 1))"
    notes: "Measured per level by the loader to enforce Rope Links invariant R3. Green Vale: 810 to 932 px, needing send_interval >= 0.189 to 0.217 s; the longest legal rope (diagonal of the Campaign B2 box, sqrt((720 - 2r)^2 + (1280 - 2r - keep_hit_lift)^2)) is 1226 px at keep_hit_radius 78 and keep_hit_lift 35 and needs 0.286 s at speed_min 110. The range ceiling 1258 is the pre-lift diagonal (before 2026-11-22), kept as a safe upper bound because Rope Links and Level State quote it. A level that fails is Rejected, never clamped."
    added: 2026-11-22
    revised: 2026-11-22
  - name: min_spacing
    status: active
    source: design/gdd/campaign-level-data.md
    referenced_by:
      - design/gdd/campaign-level-data.md
      - design/gdd/touch-mouse-input.md
    variables:
      - dist
      - keep_hit_radius
    output_range: [156, 1258]
    expression: "min over keep pairs of dist(k_i, k_j); I2 holds when min_spacing >= 2 * keep_hit_radius"
    notes: "Touch and Mouse Input calls this measurement keep_spacing (its F5); same value. Measured per level by the loader to enforce Touch and Mouse Input invariant I2 (its F5). Green Vale: 262, 206, 226, 220, 180 px against a 156 px bound. A level that fails is Rejected at load; Touch's per-level radius fallback runs only for a runtime radius change."
    added: 2026-11-22
    revised: ""

  - name: level_state
    status: active
    source: design/gdd/world-map-regions.md
    referenced_by:
      - design/gdd/world-map-regions.md
      - design/gdd/save-progress.md
      - design/gdd/menus-screens.md
    variables:
      - beaten
      - prev
      - first_of_campaign
    output_range: [0, 2]
    expression: "Beaten if result.beaten; Unlocked if first_of_campaign or beaten(prev); else Locked"
    notes: "Derived on every map open from Save and Progress results and Campaign Level Data next(); never stored (Save rule 4, AC21). Beaten implies tappable. Encoded 0 Locked, 1 Unlocked, 2 Beaten."
    added: 2026-11-22
    revised: ""
  - name: region_state
    status: active
    source: design/gdd/world-map-regions.md
    referenced_by:
      - design/gdd/world-map-regions.md
      - design/gdd/save-progress.md
    variables:
      - open
      - conquered
      - celebrated_set
    output_range: [0, 2]
    expression: "Conquered if every level beaten (region non-empty); Open if first level unlocked or beaten; else Fogged. celebrate = Conquered and region not in celebrated_set"
    notes: "Conquest is derived; Save's stored conquered-region set means the conquest sequence has been shown. A region with no levels is Fogged. Encoded 0 Fogged, 1 Open, 2 Conquered."
    added: 2026-11-22
    revised: "2026-11-22"  # variables were: unlocked_first, beaten_all, celebrated_set (renamed to the source GDD's names, /consistency-check)

  - name: strength_bar
    status: active
    source: design/gdd/level-hud.md
    referenced_by:
      - design/gdd/level-hud.md
      - design/gdd/troop-generation.md
      - design/gdd/troop-marching-clashes.md
      - design/gdd/menus-screens.md
    variables:
      - troops
      - bar_width_px
    output_range: [0, 500]
    expression: "S_side = sum of that side's keep troops (S_neutral = neutral garrisons); raw = bar_width_px * S_side / total; w_player = 0 if S_player = 0 else max(1, round_half_up(raw)); w_rival likewise; w_neutral = bar_width_px - w_player - w_rival (min 1 when S_neutral > 0, the pixel taken from the wider side; if S_neutral = 0 the rival takes bar_width_px - w_player); total 0 gives 167 / 166 / 167 grey"
    # 2026-11-22 (level-hud.md, cross-GDD review round 2): S_side was troops +
    # marching_strength(side) (H4), and the rounding rule was not recorded (B14).
    notes: "Three segments player | neutral | rival (decided 2026-11-22). Keep troops only: pawns in flight are not counted, so tying or cutting a rope never moves the bar. Updates every frame, no easing. Labels show S_player and S_rival as integers."
    added: 2026-11-22
    revised: 2026-11-22
  - name: strip_message
    status: active
    source: design/gdd/level-hud.md
    referenced_by:
      - design/gdd/level-hud.md
      - design/gdd/rope-links.md
      - design/gdd/level-state-match-flow.md
    variables:
      - refusal
      - cursor_hint
      - armed_hint
      - tutorial_prompt
      - strip_time
    output_range: [0, 1]
    expression: "first non-empty of [refusal (while strip_timer > 0), cursor_hint (once per session, while its timer > 0), armed_hint (while Armed), tutorial_prompt, none]"
    # 2026-11-22 (level-hud.md, cross-GDD review round 2, B1/B14): the timer
    # counted game steps, so a message raised while Armed never expired.
    notes: "At most one line. A new refusal replaces the current one and restarts strip_time. The timer counts unpaused rendered time (not match steps), so a pause does not expire a message and one shown while Armed still expires. self and blocked refusals raise no text."
    added: 2026-11-22
    revised: 2026-11-22

  - name: plaque_width
    status: active
    source: design/gdd/level-hud.md
    referenced_by:
      - design/gdd/level-hud.md
    variables:
      - plaque_font_px
      - digit_aspect
      - plaque_pad_px
      - plaque_min_height_px
    output_range: [38, 68]  # width over plaque_font_px 16-40 at digit_aspect 0.48, 1-2 digits
    expression: "digit = round_half_up(plaque_font_px * digit_aspect); width = plaque_pad_px + digit * digits(troops); height = max(plaque_min_height_px, plaque_font_px + 7)"
    notes: "Level HUD F3. Baseline 41-52 px wide, 30 px tall; at font 30, 44-58 px wide, 37 px tall. Registered 2026-11-22 (cross-GDD review B21)."
    added: 2026-11-22
    revised: ""
  - name: time_format
    status: active
    source: design/gdd/menus-screens.md
    referenced_by:
      - design/gdd/menus-screens.md
    variables:
      - t
    output_range: [0, 0]  # string output, "0:00.0" upward
    expression: "floor(t / 60) + ':' + two-digit floor(t mod 60) + '.' + one-digit tenths"
    notes: "Menus & Screens F3. 90.5 -> '1:30.5'. Registered 2026-11-22 (cross-GDD review B21)."
    added: 2026-11-22
    revised: ""
  - name: best_time_label
    status: active
    source: design/gdd/menus-screens.md
    referenced_by:
      - design/gdd/menus-screens.md
      - design/gdd/level-state-match-flow.md
      - design/gdd/save-progress.md
    variables:
      - t
      - best
    output_range: [0, 0]  # string output; no numeric range (cross-GDD review B21)
    expression: "title 'Clear!'; line format(t) + ' · best ' + format(best)"
    notes: "Win overlay time line. Evaluated after Save's merge (Level State rule 6 records before the overlay opens), so best <= t always holds. One fixed form on every win (revised 2026-11-22: no 'First clear!' or 'New best!' variants); on a first clear, a record or a tie best = t."
    added: 2026-11-22
    revised: ""
  - name: next_level_enabled
    status: active
    source: design/gdd/menus-screens.md
    referenced_by:
      - design/gdd/menus-screens.md
      - design/gdd/world-map-regions.md
      - design/gdd/screen-flow-scene-manager.md
    variables:
      - next
      - is_unlocked
    output_range: [0, 1]
    expression: "show_next = next(level) exists and region(next(level)) = region(level) and is_unlocked(next(level))"
    notes: "The Win overlay's Next level button. Hidden on a region's last level even when next() crosses into the next region (revised 2026-11-22, so the map plays the conquest), and whenever World Map reports the next level locked, so a reordered campaign cannot offer a locked level."
    added: 2026-11-22
    revised: ""
  - name: balance
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
    variables:
      - earned
      - spent
      - balance_cap
    output_range: [0, 999999]
    expression: "balance(currency) = earned(currency) - spent(currency)"
    notes: "Currencies and Economy F1. The wallet saves four totals that only rise (gold and diamonds, earned and spent); the balance is never stored. A spend is refused unless balance >= amount; an add is cut at balance_cap."
    added: 2026-11-25
    revised: ""
  - name: star_gold
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
      - design/gdd/stars-rewards.md
    variables:
      - region_star_gold
    output_range: [0, 2000]
    expression: "star_gold(level_id) = region_star_gold[order of the level's region]"
    notes: "Currencies and Economy F2. Gold for each goal of a level the first time it is held; paid by Stars and Rewards. Defaults 100 / 150 / 200 / 250 / 300 for regions 1 to 5; a region with no entry uses the last one."
    added: 2026-11-25
    revised: ""
  - name: win_gold
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
      - design/gdd/stars-rewards.md
    variables:
      - star_gold
      - replay_percent
    output_range: [0, 200]
    expression: "win_gold(level_id) = floor(star_gold(level_id) * replay_percent / 100)"
    notes: "Currencies and Economy F2. Gold for every win, first and replay. Defaults 10 / 15 / 20 / 25 / 30 for regions 1 to 5. Invariant E1 (the farm guard): win_gold <= star_gold / 10, true by construction while replay_percent <= 10."
    added: 2026-11-25
    revised: ""
  - name: level_gold_max
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
      - design/gdd/stars-rewards.md
    variables:
      - star_gold
      - win_gold
    output_range: [0, 6200]
    expression: "level_gold_max(level_id) = 3 * star_gold(level_id) + win_gold(level_id)"
    notes: "Currencies and Economy F3. The most a level pays once (a first win meeting all three goals); the maximum of Stars and Rewards' win_payout. Green Vale 310 per level, 1,550 for the region. A design check, not runtime code."
    added: 2026-11-25
    revised: ""
  - name: diamonds_available
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
    variables:
      - region_diamonds
      - regions_with_levels
    output_range: [0, 5000]
    expression: "diamonds_available = region_diamonds * regions_with_levels"
    notes: "Currencies and Economy F4. All the diamonds a campaign can pay; 50 with the Green Vale only, 250 with five regions. Invariant E5: the race_cost values of the loaded diamonds races sum to no more than this. A design check, not runtime code."
    added: 2026-11-25
    revised: ""
  - name: card_upgrade_cost
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
      - design/gdd/unit-cards-upgrades.md
    variables:
      - card_cost
      - tier_cost_percent
      - to_level
    output_range: [1, 300000]
    expression: "card_upgrade_cost(card, to_level) = floor(card_cost[to_level] * tier_cost_percent[tier of card] / 100)"
    notes: "Currencies and Economy F5. Gold to raise a card to to_level (2 to card_level_max). Defaults: soldier 100 / 200 / 400 / 800, rider 125 / 250 / 500 / 1,000, summon 150 / 300 / 600 / 1,200. Returns none outside the table; never 0."
    added: 2026-11-25
    revised: ""
  - name: race_unlock_cost
    status: active
    source: design/gdd/currencies-economy.md
    referenced_by:
      - design/gdd/currencies-economy.md
    variables:
      - race_cost
    output_range: [1, 1000]
    expression: "race_unlock_cost(race_id) = race_cost[race_id]"
    notes: "Currencies and Economy F6. Diamonds to unlock a diamonds race; none for a starter race or an unknown id. The purchase and the owned set are Faction Collection and Unlocks'."
    added: 2026-11-25
    revised: ""
  - name: goals_met
    status: active
    source: design/gdd/stars-rewards.md
    referenced_by:
      - design/gdd/stars-rewards.md
    variables:
      - time
      - star_time
      - keeps_lost
    output_range: [1, 3]
    expression: "goals_met = {win} + {time if star_time exists and time <= star_time} + {clean if keeps_lost = 0}"
    notes: "Stars and Rewards F1. The set of goals one win meets; the range is its count (a win always meets the win goal). star_time is per-level data (the level record's stars.time); keeps_lost counts keep_captured events where the old owner is the player."
    added: 2026-11-25
    revised: ""
  - name: held_stars
    status: active
    source: design/gdd/stars-rewards.md
    referenced_by:
      - design/gdd/stars-rewards.md
      - design/gdd/level-state-match-flow.md
    variables:
      - held_goals_before
      - goals_met
    output_range: [0, 3]
    expression: "held_stars = count(held_goals_before union goals_met)"
    notes: "Stars and Rewards F2. The value stored as Save and Progress' best stars and returned by score_win for the result record; it never falls. 0 only for a level never won."
    added: 2026-11-25
    revised: ""
  - name: win_payout
    status: active
    source: design/gdd/stars-rewards.md
    referenced_by:
      - design/gdd/stars-rewards.md
      - design/gdd/currencies-economy.md
    variables:
      - star_gold
      - new_goals
      - win_gold
    output_range: [0, 6200]
    expression: "win_payout = star_gold * count(new_goals) + win_gold"
    notes: "Stars and Rewards F3. Gold added for one win; new_goals = goals_met minus the goals held before. star_gold and win_gold are Currencies and Economy's (its F2); the maximum is its level_gold_max. Green Vale 10 to 310; region 5 30 to 930."
    added: 2026-11-25
    revised: ""
  - name: replay_ratio
    status: active
    source: design/gdd/stars-rewards.md
    referenced_by:
      - design/gdd/stars-rewards.md
      - design/gdd/currencies-economy.md
    variables:
      - star_gold
      - win_gold
    output_range: [30, 6000]
    expression: "replay_ratio = (3 * star_gold) / win_gold"
    notes: "Stars and Rewards F4. How many replay wins pay as much as one level's three stars. A design check, not runtime code; not defined when win_gold is 0. Requirement: 30 or more, kept by Currencies and Economy's invariant E1 (win_gold <= star_gold / 10). 30 at the default values in every region."
    added: 2026-11-25
    revised: ""
  - name: effective_thresholds
    status: active
    source: design/gdd/factions.md
    referenced_by:
      - design/gdd/factions.md
      - design/gdd/campaign-level-data.md
    variables:
      - lv2_at
      - lv3_at
      - lv2_offset
      - lv3_offset
    output_range: [10, 45]
    expression: "lv2_at_eff = lv2_at + lv2_offset; lv3_at_eff = lv3_at + lv3_offset"
    notes: "Factions F1. A race's keep level thresholds: lv2_at_eff 10 to 20 and lv3_at_eff 30 to 45 over the offset ranges (lv2_offset_range, lv3_offset_range). Human 15 and 35, beast 12 and 40. Applied per keep by its current owner's race (Keep Levels rule 10); Campaign Level Data F3 uses it for starting levels."
    added: 2026-11-25
    revised: ""
  - name: time_to_level
    status: active
    source: design/gdd/factions.md
    referenced_by:
      - design/gdd/factions.md
    variables:
      - gen_interval
      - gen_amount_level_1
      - gen_amount_level_2
      - capture_troops
      - lv2_at_eff
      - lv3_at_eff
    output_range: [47.5, 80.0]
    expression: "time_to_l2 = gen_interval * beats_l1; time_to_l3 = gen_interval * (beats_l1 + beats_l2); beats_l1 = ceil((lv2_at_eff - capture_troops) / gen_amount_level_1); troops_at_l2 = capture_troops + beats_l1 * gen_amount_level_1; beats_l2 = max(0, ceil((lv3_at_eff - troops_at_l2) / gen_amount_level_2))"
    notes: "Factions F2. Seconds for a freshly captured keep, left alone, to reach each level; the range is time_to_l3 over the offset ranges, 54 to 66 s for a legal race (T2). Human 35.0 and 60.0 s; beast 27.5 and 62.5 s."
    added: 2026-11-25
    revised: ""
  - name: veteran_launch
    status: active
    source: design/gdd/unit-cards-upgrades.md
    referenced_by:
      - design/gdd/unit-cards-upgrades.md
      - design/gdd/troop-marching-clashes.md
    variables:
      - count
      - veteran_every
      - tier
      - level
    output_range: [0, 1]
    expression: "count = count + 1; veteran_launch = (veteran_every > 0) and (count = veteran_every); when it is true, count = 0"
    notes: "Unit Cards and Upgrades F1. True or false for one launch of a unit kind by an owner with card levels; true on exactly every Nth launch. Asked by Troop Marching at each send through veteran_for_launch (its rule 3); a relay is not a launch."
    added: 2026-11-25
    revised: ""
  - name: card_power_gain
    status: active
    source: design/gdd/unit-cards-upgrades.md
    referenced_by:
      - design/gdd/unit-cards-upgrades.md
    variables:
      - veteran_bonus
      - veteran_every
      - strength
    output_range: [0, 0.25]
    expression: "card_power_gain = veteran_bonus / (veteran_every * strength), and 0 when veteran_every is 0"
    notes: "Unit Cards and Upgrades F2. The share by which the average strength of a kind's launches rises; capped by card_power_cap (invariant C3)."
    added: 2026-11-25
    revised: ""
  - name: upgraded_power
    status: active
    source: design/gdd/unit-cards-upgrades.md
    referenced_by:
      - design/gdd/unit-cards-upgrades.md
    variables:
      - unit_power
      - card_power_gain
    output_range: [0.90, 2.75]
    expression: "upgraded_power = unit_power * (1 + card_power_gain)"
    notes: "Unit Cards and Upgrades F3. Used only by the loader's tier-order check (C4); nothing in a match reads it. unit_power is Unit Roster and Stats' F1 (not yet registered)."
    added: 2026-11-25
    revised: ""

