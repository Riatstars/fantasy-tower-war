<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tower War</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d3a2a; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { font-variant-numeric: tabular-nums; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Tower War: drag a rope from your keep to another keep and your troops march along it.
// Keeps generate troops on a tick, level up 1→3 by troop count, and the level is how many
// ropes a keep can hold. Take every keep on the map to win.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: a portrait phone table
const PIXEL = false;
const FONT = 'Georgia, "Palatino Linotype", "Book Antiqua", serif';
const TITLE = 'Tower War';
const CONTROLS = [
  'Drag from your keep to another keep: send troops',
  'Swipe across one of your ropes: cut it',
  'More troops = higher level = more ropes (max 3)',
  'Keys: Tab pick keep, Up/Down pick target,',
  'Space tie rope, X cut its ropes, P pause, M mute',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function hash(n) { // decoration noise only (never gameplay): a fixed value per integer
  let t = Math.imul(n ^ 0x9E3779B9, 0x85EBCA6B); t ^= t >>> 13; t = Math.imul(t, 0xC2B2AE35); t ^= t >>> 16;
  return (t >>> 0) / 4294967296;
}
const events = [];

// ---- Palette (tabletop diorama) -----------------------------------------------------------
const COL = {
  felt: '#2f5a3c', feltDark: '#1d3a2a', parch: '#e9dcbc', parchDark: '#cdb98d', ink: '#5b4630',
  gold: '#e3b544', goldDark: '#9a7420',
  owner: ['#8d8a86', '#2f5fc9', '#c23a37'],        // neutral stone, player royal blue, rival crimson
  ownerLight: ['#c9c4bb', '#7aa2f0', '#f07a6e'],
  ownerDark: ['#55524f', '#1c3a82', '#7c1d1f'],
  stoneLit: '#d9ccb2', stone: '#b8ab95', stoneShade: '#837f8c', mortar: '#7a6f61',
  rope: '#9b6a36', ropeDark: '#5f3d18',
  shadow: 'rgba(20,30,60,0.28)',
};

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1);
  viewScale = k;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  bgCache = null;
}
let bgCache = null, bgFor = -2;
addEventListener('resize', fit);
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function textShadowed(s, x, y, size, c, align = 'center', weight = 'bold') {
  text(s, x + 2, y + 2, size, 'rgba(0,0,0,0.35)', align, weight); text(s, x, y, size, c, align, weight);
}

// ---- Input: keys by position, pointer (touch and mouse) ---------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());

// Pointer events are queued and handled on the fixed step, never in the handler.
const pointerQ = [];
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => { startAudio(); e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointerQ.push({ type: 'down', ...toLogical(e) }); });
canvas.addEventListener('pointermove', e => { pointerQ.push({ type: 'move', ...toLogical(e) }); });
canvas.addEventListener('pointerup', e => { pointerQ.push({ type: 'up', ...toLogical(e) }); });
canvas.addEventListener('pointercancel', e => { pointerQ.push({ type: 'up', ...toLogical(e) }); });

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function thud(vol = 0.15) { // a soft drum tap: filtered noise burst
  if (!audio || muted) return;
  const ac = audio.ac, n = Math.floor(ac.sampleRate * 0.06), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (hash(i * 7 + 3) * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = vol;
  s.connect(f).connect(g).connect(audio.out); s.start();
}
const sfx = {
  rope() { tone(220, 0.08, 'triangle', 0.25, 300); tone(660, 0.12, 'sine', 0.12); },
  cut() { tone(500, 0.15, 'sawtooth', 0.1, -380); },
  capture(o) { const b = o === 1 ? 392 : 262; tone(b, 0.12, 'square', 0.12); setTimeout(() => tone(b * 1.5, 0.22, 'square', 0.12), 90); },
  level() { tone(523, 0.1, 'triangle', 0.2); setTimeout(() => tone(784, 0.18, 'triangle', 0.2), 80); setTimeout(() => tone(1046, 0.25, 'sine', 0.12), 160); },
  clash() { thud(0.08); },
  win() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.22), i * 140)); },
  lose() { [330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.4, 'sawtooth', 0.12), i * 200)); },
  no() { tone(140, 0.12, 'square', 0.12); },
};
let marchTick = 0;

// ---- Progress (per-player convenience; the game works without it) --------------------------
let unlocked = 1;
try { unlocked = Math.max(1, Math.min(MAPS.length, Number(localStorage.getItem('towerwar.unlocked')) || 1)); } catch (_) {}
function saveUnlocked() { try { localStorage.setItem('towerwar.unlocked', String(unlocked)); } catch (_) {} }

// ---- The game state -------------------------------------------------------------------------
let scene, state, mapIndex = 0, selectIndex = 0;
function levelOf(troops) { return troops >= tune.lv3_at ? 3 : troops >= tune.lv2_at ? 2 : 1; }
function reset() { startMap(mapIndex); }
function startMap(i) {
  seed = (Number(params.get('seed')) || CONFIG.seed) + i * 101;
  mapIndex = i;
  const m = MAPS[i];
  const keeps = m.keeps.map((k, id) => {
    const troops = k[2] === 1 ? tune.player_start : k[2] === 2 ? m.rival : k[3];
    return { id, x: k[0], y: k[1], owner: k[2], troops, level: levelOf(troops), gen: 0,
      flash: 0, pop: 0, bannerOwner: k[2], wobble: hash(id + i * 31) * 6.28 };
  });
  state = {
    t: 0, score: 0, gained: '', keeps, links: [], pawns: [], dead: [], fx: [], floats: [],
    drag: null, swipe: null, linkedOnce: false, cutOnce: false, captured: 0, msg: '', msgT: 0,
    aiT: 1.5, sel: 0, tgt: 0, kbUsed: false, endT: 0, ended: false,
  };
  state.sel = keeps.findIndex(k => k.owner === 1);
  state.tgt = nearestTarget(keeps[state.sel], 0, 1);
  bgCache = null;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function linksFrom(k) { return state.links.filter(l => l.from === k); }
function hasLink(a, b) { return state.links.some(l => l.from === a && l.to === b); }
function canLink(a, b) {
  if (!a || !b || a === b || a.owner === 0) return 'no';
  if (dist(a, b) > tune.link_range) return 'range';
  if (hasLink(a, b)) return 'dup';
  if (linksFrom(a).length >= a.level) return 'slots';
  return 'ok';
}
function addLink(a, b) {
  state.links.push({ from: a, to: b, owner: a.owner, timer: tune.send_interval * 0.5, grow: 0, age: 0 });
  if (a.owner === 1) { sfx.rope(); state.linkedOnce = true; events.push({ type: 'link', from: a.id, to: b.id }); }
}
function cutLink(l, at = 0.5) {
  const i = state.links.indexOf(l); if (i < 0) return;
  state.links.splice(i, 1);
  state.dead.push({ ax: l.from.x, ay: l.from.y, bx: l.to.x, by: l.to.y, at, age: 0, owner: l.owner });
  if (l.owner === 1) { sfx.cut(); events.push({ type: 'cut', from: l.from.id, to: l.to.id }); }
}
function keepAt(x, y) {
  let best = null, bd = tune.keep_radius;
  for (const k of state.keeps) { const d = Math.hypot(k.x - x, k.y - y + 20); if (d < bd) { bd = d; best = k; } }
  return best;
}
function nearestTarget(src, skip, dir) {
  // index of the next keep (not src) in range, by distance order, stepping dir from current
  const list = state.keeps.filter(k => k !== src && dist(k, src) <= tune.link_range).sort((a, b) => dist(a, src) - dist(b, src));
  if (!list.length) return -1;
  const cur = list.findIndex(k => k.id === skip);
  const n = cur < 0 ? 0 : (cur + dir + list.length) % list.length;
  return list[n].id;
}
function say(msg) { state.msg = msg; state.msgT = 2.4; }
function burst(x, y, color, n, speed, kind = 'bit') {
  for (let i = 0; i < n; i++) {
    const a = rng() * 6.283, s = speed * (0.4 + rng() * 0.8);
    state.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.4, life: 0.6 + rng() * 0.5, age: 0, color, kind, rot: rng() * 6 });
  }
}

function capture(k, owner) {
  const prev = k.owner;
  k.owner = owner; k.troops = 1; k.level = 1; k.pop = 1; k.flash = 1;
  for (const l of linksFrom(k).slice()) cutLink(l, 0.15);
  burst(k.x, k.y - 60, COL.owner[owner], 26, 260, 'flag');
  burst(k.x, k.y - 60, COL.gold, 10, 200, 'bit');
  sfx.capture(owner);
  state.floats.push({ x: k.x, y: k.y - 120, s: owner === 1 ? 'Taken!' : prev === 1 ? 'Lost!' : 'Seized', c: COL.owner[owner], age: 0 });
  if (owner === 1) state.captured++;
  events.push({ type: 'capture', keep: k.id, from: prev, to: owner });
}

// ---- The rival -------------------------------------------------------------------------------
function incomingThreat(k) { // enemy troops marching at k
  let n = 0; for (const p of state.pawns) if (p.to === k && p.owner !== k.owner) n++; return n;
}
function aiThink() {
  const m = MAPS[mapIndex];
  const mine = state.keeps.filter(k => k.owner === 2);
  const graceOver = mapIndex > 0 || state.t > tune.ai_grace;
  for (const k of mine) {
    // drop ropes that are no longer worth it
    for (const l of linksFrom(k).slice()) {
      const tg = l.to;
      if (tg.owner === 2 && incomingThreat(tg) < tg.troops * 0.5 && l.age > 2) cutLink(l);
      else if (tg.owner === 1 && tg.troops > k.troops + 12 && rng() < 0.5) cutLink(l);
      else if (incomingThreat(k) > k.troops + 2 && k.troops < 4) cutLink(l);
    }
  }
  for (const k of mine.sort((a, b) => b.troops - a.troops)) {
    if (linksFrom(k).length >= k.level) continue;
    if (k.troops < tune.ai_min_send && incomingThreat(k) === 0) continue;
    let best = null, bs = 0;
    for (const t of state.keeps) {
      if (canLink(k, t) !== 'ok') continue;
      const d = dist(k, t) / 25;
      let s = 0;
      if (t.owner === 2) { const th = incomingThreat(t); if (th >= t.troops - 2 && th > 0) s = 80 - d; }
      else if (t.owner === 0) { s = 52 - t.troops * 2 - d + (k.troops > t.troops ? 10 : -15); }
      else if (t.owner === 1 && graceOver) {
        if (k.troops * m.aggro > t.troops + 4) s = 40 - t.troops * 1.5 - d + m.aggro * 22;
      }
      s += rng() * 6;
      if (s > bs) { bs = s; best = t; }
    }
    if (best) addLink(k, best);
  }
}

// ---- Simulation ---------------------------------------------------------------------------------
function simulate(dt) {
  state.t += dt;
  // generation (periodic) and levels
  for (const k of state.keeps) {
    k.flash = Math.max(0, k.flash - dt * 2); k.pop = Math.max(0, k.pop - dt * 1.6);
    if (k.owner !== 0) {
      k.gen += dt;
      if (k.gen >= tune.gen_interval) {
        k.gen -= tune.gen_interval;
        if (k.troops < tune.troop_cap) k.troops = Math.min(tune.troop_cap, k.troops + [0, tune.gen_l1, tune.gen_l2, tune.gen_l3][k.level]);
      }
    }
    const lv = levelOf(k.troops);
    if (lv > k.level && k.owner !== 0) {
      k.pop = 1;
      if (k.owner === 1) {
        sfx.level(); burst(k.x, k.y - 70, COL.gold, 16, 170, 'spark');
        state.floats.push({ x: k.x, y: k.y - 130, s: `Level ${lv}: ${lv} ropes`, c: COL.gold, age: 0 });
        events.push({ type: 'level', keep: k.id, level: lv });
      }
    }
    k.level = lv;
    const ls = linksFrom(k);
    while (ls.length > k.level) cutLink(ls.pop(), 0.2); // dropped a level: the newest rope falls
  }
  // ropes send pawns
  for (const l of state.links) {
    l.age += dt; l.grow = Math.min(1, l.grow + dt * 5);
    l.timer += dt;
    if (l.timer >= tune.send_interval && l.grow >= 1) {
      l.timer -= tune.send_interval;
      if (l.from.troops >= 1) {
        l.from.troops -= 1;
        state.pawns.push({ from: l.from, to: l.to, owner: l.owner, d: 0, len: dist(l.from, l.to), sx: l.from.x, sy: l.from.y, tx: l.to.x, ty: l.to.y, ph: rng() * 6 });
      }
    } else if (l.timer > tune.send_interval) l.timer = tune.send_interval;
  }
  // pawns march
  for (const p of state.pawns) p.d += tune.pawn_speed * dt;
  // opposing pawns on the same pair of keeps fight where they meet
  const P = state.pawns;
  for (let i = 0; i < P.length; i++) {
    const p = P[i]; if (p.dead) continue;
    for (let j = i + 1; j < P.length; j++) {
      const q = P[j]; if (q.dead || q.owner === p.owner) continue;
      if (p.from === q.to && p.to === q.from && p.d + q.d >= p.len) {
        p.dead = q.dead = true;
        const f = p.d / p.len;
        const x = p.sx + (p.tx - p.sx) * f, y = p.sy + (p.ty - p.sy) * f;
        burst(x, y, '#d8c8a0', 5, 70, 'dust'); sfx.clash();
        break;
      }
    }
  }
  // arrivals
  for (const p of P) {
    if (p.dead || p.d < p.len) continue;
    p.dead = true;
    const k = p.to;
    k.flash = 0.6;
    if (k.owner === p.owner) k.troops = Math.min(tune.troop_cap + 40, k.troops + 1);
    else if (k.troops >= 1) { k.troops -= 1; if (rng() < 0.4) burst(k.x, k.y - 30, '#d8c8a0', 2, 60, 'dust'); }
    else capture(k, p.owner);
  }
  state.pawns = P.filter(p => !p.dead);
  if (state.pawns.length) { marchTick -= dt; if (marchTick <= 0) { marchTick = 0.45; thud(0.035); } }
  // fx
  for (const d of state.dead) d.age += dt;
  state.dead = state.dead.filter(d => d.age < 0.9);
  for (const f of state.fx) { f.age += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 420 * dt; f.vx *= 0.98; f.rot += dt * 8; }
  state.fx = state.fx.filter(f => f.age < f.life);
  for (const f of state.floats) f.age += dt;
  state.floats = state.floats.filter(f => f.age < 1.6);
  state.msgT = Math.max(0, state.msgT - dt);
  // rival
  state.aiT -= dt;
  if (state.aiT <= 0) { state.aiT = MAPS[mapIndex].think * (0.8 + rng() * 0.4); aiThink(); }
  // ends
  const owners = state.keeps.map(k => k.owner);
  const mineN = owners.filter(o => o === 1).length;
  if (!state.ended) {
    if (mineN === state.keeps.length) {
      state.ended = true; state.endT = 0; state.win = true;
      if (mapIndex + 1 >= unlocked && mapIndex + 1 < MAPS.length) { unlocked = mapIndex + 2; saveUnlocked(); }
      sfx.win(); events.push({ type: 'win', map: mapIndex });
      state.gained = mapIndex + 1 >= MAPS.length ? 'Every map is yours!' : 'Map won!';
    } else if (mineN === 0 && !state.pawns.some(p => p.owner === 1)) {
      state.ended = true; state.endT = 0; state.win = false;
      sfx.lose(); events.push({ type: 'lose', map: mapIndex });
      state.gained = 'Your keeps have fallen';
    }
  } else {
    state.endT += dt;
    if (state.endT > 1.2) { scene = state.win ? 'results' : 'over'; state.drag = null; }
  }
}

// ---- Player input in play -------------------------------------------------------------------
function segHit(ax, ay, bx, by, cx, cy, dx, dy) { // returns t along AB where CD crosses it, or -1
  const r1 = bx - ax, r2 = by - ay, s1 = dx - cx, s2 = dy - cy;
  const den = r1 * s2 - r2 * s1; if (Math.abs(den) < 1e-6) return -1;
  const t = ((cx - ax) * s2 - (cy - ay) * s1) / den, u = ((cx - ax) * r2 - (cy - ay) * r1) / den;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1 ? t : -1;
}
const UI = { pause: { x: 650, y: 52, r: 30 }, mute: { x: 584, y: 52, r: 30 } };
function inBtn(b, p) { return Math.hypot(b.x - p.x, b.y - p.y) < b.r + 6; }
function playPointer(ev) {
  if (ev.type === 'down') {
    if (inBtn(UI.pause, ev)) { scene = 'pause'; return; }
    if (inBtn(UI.mute, ev)) { setMuted(!muted); return; }
    const k = keepAt(ev.x, ev.y);
    if (k && k.owner === 1) state.drag = { from: k, x: ev.x, y: ev.y };
    else state.swipe = { x: ev.x, y: ev.y, trail: [{ x: ev.x, y: ev.y, age: 0 }] };
  } else if (ev.type === 'move') {
    if (state.drag) {
      // dragging across your own ropes from a keep never cuts them; just follow the finger
      state.drag.x = ev.x; state.drag.y = ev.y;
    } else if (state.swipe) {
      const s = state.swipe;
      for (const l of state.links.slice()) {
        if (l.owner !== 1) continue;
        const t = segHit(l.from.x, l.from.y - 30, l.to.x, l.to.y - 30, s.x, s.y, ev.x, ev.y);
        if (t >= 0) { cutLink(l, t); state.cutOnce = true; }
      }
      s.x = ev.x; s.y = ev.y; s.trail.push({ x: ev.x, y: ev.y, age: 0 });
    }
  } else if (ev.type === 'up') {
    if (state.drag) {
      const a = state.drag.from, b = keepAt(ev.x, ev.y);
      if (b && b !== a) {
        const why = canLink(a, b);
        if (why === 'ok') addLink(a, b);
        else { sfx.no(); say(why === 'slots' ? `Level ${a.level} keep: only ${a.level} rope${a.level > 1 ? 's' : ''}. Grow it or cut one.` : why === 'range' ? 'Too far for a rope' : 'Already roped'); }
      }
      state.drag = null;
    }
    if (state.swipe) state.swipe.done = true;
  }
}
function playKeys() {
  const mine = state.keeps.filter(k => k.owner === 1);
  if (!mine.length) return;
  let src = state.keeps[state.sel];
  if (!src || src.owner !== 1) { src = mine[0]; state.sel = src.id; state.tgt = nearestTarget(src, -1, 1); }
  if (pressed('Tab') || pressed('ArrowRight') || pressed('ArrowLeft')) {
    state.kbUsed = true;
    const i = mine.indexOf(src), n = (i + (pressed('ArrowLeft') ? -1 : 1) + mine.length) % mine.length;

    const tx = why === 'ok' ? b.x : state.drag.x, ty = why === 'ok' ? b.y - lift : state.drag.y;
    drawRope(a.x, a.y - lift, tx, ty, 1, t, why === 'ok' ? 1 : 0.55, 0);
    if (why !== 'ok' && why !== 'none') { ctx.strokeStyle = '#c23a37'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tx - 10, ty - 10); ctx.lineTo(tx + 10, ty + 10); ctx.moveTo(tx + 10, ty - 10); ctx.lineTo(tx - 10, ty + 10); ctx.stroke(); }
    if (why === 'ok') { ctx.strokeStyle = COL.gold; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(b.x, b.y + 4, 58, 20, 0, 0, 6.3); ctx.stroke(); }
  }
  // keyboard selection
  if (state.kbUsed) {
    const s = state.keeps[state.sel], g = state.keeps[state.tgt];
    if (s) { ctx.strokeStyle = COL.gold; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(s.x, s.y + 4, 60, 21, 0, 0, 6.3); ctx.stroke(); }
    if (g) { ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(g.x, g.y + 4, 60, 21, 0, 0, 6.3); ctx.stroke(); ctx.restore(); }
  }
  // keeps and pawns in depth order (pawns sorted with keeps by y)
  const items = [];
  for (const k of state.keeps) items.push({ y: k.y, k });
  for (const p of state.pawns) { const f = p.d / p.len; items.push({ y: p.sy + (p.ty - p.sy) * f, p, f }); }
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.k) { const k = it.k; drawKeep(k.x, k.y, k.owner, k.level, { t, pop: k.pop, flash: k.flash, wobble: k.wobble, scale: 1.25 }); }
    else { const p = it.p, f = it.f; drawPawn(p.sx + (p.tx - p.sx) * f, p.sy + (p.ty - p.sy) * f - lift + 14, p.owner, t + p.ph, 1.45); }
  }
  for (const l of state.links) { drawPin(l.from.x, l.from.y - lift, l.owner); if (l.grow >= 1) drawPin(l.to.x, l.to.y - lift, l.owner); }
  for (const k of state.keeps) drawPlaque(k);
  // swipe trail
  if (state.swipe) {
    const tr = state.swipe.trail; for (const p of tr) p.age += 1 / 60;
    ctx.strokeStyle = 'rgba(255,250,235,0.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 1; i < tr.length; i++) { ctx.globalAlpha = Math.max(0, 1 - tr[i].age * 3); ctx.beginPath(); ctx.moveTo(tr[i - 1].x, tr[i - 1].y); ctx.lineTo(tr[i].x, tr[i].y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (state.swipe.done && tr.every(p => p.age > 0.35)) state.swipe = null;
  }
  drawFx();
  // first-minute hint: drag from your keep to the nearest grey keep
  if (!state.linkedOnce) {
    const me = state.keeps.find(k => k.owner === 1);
    const tg = me && state.keeps.filter(k => k.owner === 0 && dist(k, me) <= tune.link_range).sort((a, b) => dist(a, me) - dist(b, me))[0];
    if (me && tg) {
      const f = (t * 0.6) % 1, hx = me.x + (tg.x - me.x) * f, hy = me.y - lift + (tg.y - me.y) * f;
      ctx.save(); ctx.setLineDash([4, 10]); ctx.strokeStyle = 'rgba(227,181,68,0.9)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(me.x, me.y - lift); ctx.lineTo(hx, hy); ctx.stroke(); ctx.restore();
      drawFinger(hx, hy);
      ctx.strokeStyle = `rgba(227,181,68,${1 - f})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(tg.x, tg.y + 4, 40 + f * 30, 14 + f * 10, 0, 0, 6.3); ctx.stroke();
    }
  }
}
function drawFinger(x, y) { // a drawn pointing hand for the hint
  ctx.save(); ctx.translate(x + 6, y + 6); ctx.rotate(-0.4);
  ctx.fillStyle = '#f7e2c6'; ctx.strokeStyle = '#6b4a2e'; ctx.lineWidth = 2;
  roundRect(-4, 0, 9, 22, 4); ctx.fill(); ctx.stroke();
  roundRect(-10, 16, 24, 22, 8); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-3, 22); ctx.lineTo(-3, 28); ctx.moveTo(4, 22); ctx.lineTo(4, 28); ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  const m = MAPS[mapIndex];
  textShadowed(`Map ${mapIndex + 1}: ${m.name}`, 26, 34, 26, '#f3e6c4', 'left');
  // strength bar: every troop on the table, by side
  const sum = [0, 0, 0];
  for (const k of state.keeps) sum[k.owner] += k.troops;
  for (const p of state.pawns) sum[p.owner] += 1;
  const tot = sum[0] + sum[1] + sum[2] || 1, bx = 26, by = 58, bw = 500, bh = 14;
  let x = bx;
  roundRect(bx - 2, by - 2, bw + 4, bh + 4, 6); ctx.fillStyle = '#2b1a0c'; ctx.fill();
  for (const o of [1, 0, 2]) { const w = bw * sum[o] / tot; ctx.fillStyle = COL.owner[o]; ctx.fillRect(x, by, w, bh); x += w; }
  text(`You ${Math.floor(sum[1])}`, bx + 6, by + 30, 22, COL.ownerLight[1], 'left', 'bold');
  text(`Rival ${Math.floor(sum[2])}`, bx + bw - 6, by + 30, 22, COL.ownerLight[2], 'right', 'bold');
  iconMute(UI.mute); iconPause(UI.pause, false);
  // bottom strip: what to do now
  let hint = '';
  if (state.msgT > 0) hint = state.msg;
  else if (!state.linkedOnce) hint = 'Drag from your blue keep to a grey keep';
  else if (!state.cutOnce && state.t > 20 && mapIndex === 0) hint = 'Swipe across a rope to cut it and reroute';
  else if (mapIndex === 0 && state.t < 40) hint = 'More troops: level up, more ropes (max 3)';
  if (hint) {
    ctx.font = `bold 22px ${FONT}`; const w = ctx.measureText(hint).width + 40;
    ctx.fillStyle = 'rgba(40,25,12,0.82)'; roundRect(W / 2 - w / 2, H - 58, w, 42, 12); ctx.fill();
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 1.5; ctx.stroke();
    text(hint, W / 2, H - 37, 22, '#f8edd0', 'center', 'bold');
  }
}

// ---- Menus ----------------------------------------------------------------------------------------
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(x + 4, y + 6, w, h, 18); ctx.fill();
  ctx.fillStyle = COL.parch; roundRect(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = COL.goldDark; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(91,70,48,0.35)'; ctx.lineWidth = 1.5; roundRect(x + 10, y + 10, w - 20, h - 20, 12); ctx.stroke();
}
function button(label, x, y, w, h, primary) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; roundRect(x - w / 2 + 3, y - h / 2 + 4, w, h, 14); ctx.fill();
  ctx.fillStyle = primary ? COL.owner[1] : '#7b5a37'; roundRect(x - w / 2, y - h / 2, w, h, 14); ctx.fill();
  ctx.strokeStyle = COL.gold; ctx.lineWidth = 2.5; ctx.stroke();
  text(label, x, y + 1, 28, '#fff8e6', 'center', 'bold');
  return { x: x - w / 2, y: y - h / 2, w, h };
}
function inRect(r, p) { return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
let menuBtns = {};
function lastUp() { let u = null; for (const e of pointerQ) if (e.type === 'up') u = e; return u; }

// ---- Scenes -----------------------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear(COL.felt);
      ctx.fillStyle = COL.parch; roundRect(20, 20, W - 40, H - 40, 18); ctx.fill();
      text('Figures', W / 2, 70, 40, COL.ink, 'center', 'bold');
      const t = state.t;
      const row = (y, items) => items.forEach((it, i) => { const x = (i + 0.5) * W / items.length; it.d(x, y); text(it.n, x, y + 78, 20, COL.ink); });
      row(300, [
        { n: 'Your keep Lv1', d: (x, y) => drawKeep(x, y, 1, 1, { t }) },
        { n: 'Your keep Lv2', d: (x, y) => drawKeep(x, y, 1, 2, { t }) },
        { n: 'Your keep Lv3', d: (x, y) => drawKeep(x, y, 1, 3, { t }) },
      ]);
      row(620, [
        { n: 'Rival keep Lv1', d: (x, y) => drawKeep(x, y, 2, 1, { t }) },
        { n: 'Rival keep Lv3', d: (x, y) => drawKeep(x, y, 2, 3, { t }) },
        { n: 'Neutral keep', d: (x, y) => drawKeep(x, y, 0, 2, { t }) },
      ]);
      row(900, [
        { n: 'Your pawn', d: (x, y) => drawPawn(x, y, 1, t, 3.2) },
        { n: 'Rival pawn', d: (x, y) => drawPawn(x, y, 2, t, 3.2) },
      ]);
      drawRope(120, 1100, 600, 1100, 1, t); drawPin(120, 1100, 1); drawPin(600, 1100, 1);
      text('Rope (yours)', W / 2, 1150, 20, COL.ink);
    },
  },
  title: {
    update() {
      const u = lastUp();
      if (pressed('Enter') || pressed('Space') || u) { selectIndex = unlocked - 1; scene = 'select'; }
    },
    draw() {
      mapIndex = 0; drawTable();
      const t = clock.now();
      drawRope(200, 520, 520, 440, 1, t); drawPin(200, 520, 1); drawPin(520, 440, 1);
      drawKeep(200, 550, 1, 3, { t }); drawKeep(520, 470, 2, 2, { t });
      drawPawn(310, 528, 1, t, 1.6); drawPawn(400, 507, 1, t + 1, 1.6);
      panel(70, 140, 580, 170);
      textShadowed(TITLE, W / 2, 210, 76, COL.owner[1]);
      text('Rope your keeps. Take the table.', W / 2, 272, 26, COL.ink, 'center', 'italic');
      panel(50, 650, 620, 330);
      CONTROLS.forEach((c, i) => text(c, W / 2, 705 + i * 52, 23, COL.ink));
      button('Tap or Enter to start', W / 2, 1080, 440, 84, true);
    },
  },
  select: {
    update() {
      if (pressed('ArrowUp') || pressed('ArrowLeft')) selectIndex = Math.max(0, selectIndex - 1);
      if (pressed('ArrowDown') || pressed('ArrowRight')) selectIndex = Math.min(unlocked - 1, selectIndex + 1);
      if (pressed('Enter') || pressed('Space')) { startMap(selectIndex); scene = 'play'; return; }
      const u = lastUp();
      if (u) for (let i = 0; i < MAPS.length; i++) if (i < unlocked && inRect(menuBtns['m' + i], u)) { startMap(i); scene = 'play'; return; }
    },
    draw() {
      mapIndex = 0; drawTable();
      panel(60, 130, 600, 110); textShadowed('Choose a map', W / 2, 186, 48, COL.ink);
      // the ladder: medallions on a dotted ink road
      const pos = i => ({ x: i % 2 ? 470 : 250, y: 1040 - i * 175 });
      ctx.save(); ctx.setLineDash([6, 10]); ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.beginPath();
      MAPS.forEach((_, i) => { const p = pos(i); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); ctx.stroke(); ctx.restore();
      MAPS.forEach((m, i) => {
        const p = pos(i), open = i < unlocked, sel = i === selectIndex;
        if (sel) { ctx.strokeStyle = COL.gold; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(p.x, p.y, 62, 0, 6.3); ctx.stroke(); }
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(p.x + 3, p.y + 5, 52, 0, 6.3); ctx.fill();
        ctx.fillStyle = open ? (i < unlocked - 1 ? COL.owner[1] : '#7b5a37') : '#8d8a86'; ctx.beginPath(); ctx.arc(p.x, p.y, 52, 0, 6.3); ctx.fill();
        ctx.strokeStyle = COL.gold; ctx.lineWidth = 3; ctx.stroke();
        if (open) text(String(i + 1), p.x, p.y + 2, 44, '#fff8e6', 'center', 'bold');
        else { // drawn padlock
          ctx.strokeStyle = '#efe7d5'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(p.x, p.y - 8, 12, Math.PI, 0); ctx.stroke();
          ctx.fillStyle = '#efe7d5'; roundRect(p.x - 18, p.y - 8, 36, 28, 5); ctx.fill();
          ctx.fillStyle = '#6f6b66'; ctx.beginPath(); ctx.arc(p.x, p.y + 4, 4, 0, 6.3); ctx.fill();
        }
        const lx = i % 2 ? p.x - 80 : p.x + 80;
        ctx.font = `bold 26px ${FONT}`; const tw = ctx.measureText(m.name).width + 24;
        ctx.fillStyle = 'rgba(233,220,188,0.92)'; roundRect(i % 2 ? lx - tw : lx, p.y - 22, tw, 44, 10); ctx.fill();
        text(m.name, i % 2 ? lx - 12 : lx + 12, p.y + 1, 26, open ? COL.ink : '#8a8070', i % 2 ? 'right' : 'left', 'bold');
        menuBtns['m' + i] = { x: p.x - 56, y: p.y - 56, w: 112, h: 112 };
      });
      text('Tap a map, or arrows and Enter', W / 2, 1180, 22, '#f3e6c4');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      for (const ev of pointerQ) { playPointer(ev); if (scene !== 'play') return; }
      playKeys();
      simulate(dt);
    },
    draw() { drawWorld(); drawHUD(); },
  },
  pause: {
    update() {
      const u = lastUp();
      if (pressed('KeyP') || pressed('Escape') || (u && inRect(menuBtns.resume, u))) { scene = 'play'; return; }
      if (pressed('KeyR') || (u && inRect(menuBtns.restart, u))) { startMap(mapIndex); scene = 'play'; return; }
      if (u && inRect(menuBtns.maps, u)) { selectIndex = mapIndex; scene = 'select'; }
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(15,10,5,0.5)'; ctx.fillRect(0, 0, W, H);
      panel(110, 420, 500, 440); textShadowed('Paused', W / 2, 490, 54, COL.ink);
      menuBtns.resume = button('Resume (P)', W / 2, 590, 380, 76, true);
      menuBtns.restart = button('Restart map (R)', W / 2, 690, 380, 76, false);
      menuBtns.maps = button('Map select', W / 2, 790, 380, 76, false);
    },
  },
  over: {
    update() {
      const u = lastUp();
      if (pressed('KeyR') || pressed('Enter') || pressed('Space') || (u && inRect(menuBtns.retry, u))) { startMap(mapIndex); scene = 'play'; return; }
      if (u && inRect(menuBtns.maps, u)) { selectIndex = mapIndex; scene = 'select'; }
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(40,5,5,0.45)'; ctx.fillRect(0, 0, W, H);
      panel(90, 420, 540, 420);
      textShadowed(state.gained || 'Defeat', W / 2, 500, 42, COL.owner[2]);
      text(`Held out ${fmtTime(state.t)} · took ${state.captured} keep${state.captured === 1 ? '' : 's'}`, W / 2, 560, 24, COL.ink);
      menuBtns.retry = button('Try again (R)', W / 2, 660, 380, 76, true);
      menuBtns.maps = button('Map select', W / 2, 760, 380, 76, false);
    },
  },
  results: {
    update() {
      const u = lastUp(), last = mapIndex + 1 >= MAPS.length;
      if (pressed('Enter') || pressed('Space') || (u && inRect(menuBtns.next, u))) { startMap(last ? mapIndex : mapIndex + 1); scene = 'play'; return; }
      if (u && inRect(menuBtns.maps, u)) { selectIndex = Math.min(unlocked - 1, mapIndex + 1); scene = 'select'; }
    },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(10,20,40,0.4)'; ctx.fillRect(0, 0, W, H);
      const last = mapIndex + 1 >= MAPS.length;
      panel(90, 420, 540, 420);
      textShadowed(state.gained || 'Victory', W / 2, 500, 46, COL.owner[1]);
      text(`${MAPS[mapIndex].name} in ${fmtTime(state.t)} · took ${state.captured} keeps`, W / 2, 560, 24, COL.ink);
      menuBtns.next = button(last ? 'Play it again' : 'Next map (Enter)', W / 2, 660, 380, 76, true);
      menuBtns.maps = button('Map select', W / 2, 760, 380, 76, false);
    },
  },
};
function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; }

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); pointerQ.length = 0;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { const keep = mapIndex; scenes[scene].draw(); if (scene === 'title' || scene === 'select') { mapIndex = keep; } }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
